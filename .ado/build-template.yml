#
# The build and pack template used by the CI publish and PR validation scripts.
# The template sets the version number, builds all binaries, and then packs them as NuGet packages.
#

parameters:
  # MustPublish is `true` for CI builds and `false` for PR validation.
- name: MustPublish
  type: boolean
  default: false
  # To fake building hermes for faster debugging.
- name: FakeBuild
  type: boolean
  default: false

  # Build with HERMESVM_SANITIZE_HANDLES=ON to deterministically surface GC-safety
  # bugs (the GC moves the heap after every allocation). Off by default; enable it
  # for diagnostic / red-green test runs.
- name: SanitizeHandles
  type: boolean
  default: false

  # Matrix with target platforms for Hermes binaries.
- name: BuildMatrix
  type: object
  default:
  - Name: uwp_x64
    TargetCPU: x64
    BuildUWP: --uwp
  - Name: uwp_x86
    TargetCPU: x86
    BuildUWP: --uwp
  - Name: uwp_arm64
    TargetCPU: arm64
    BuildUWP: --uwp
  - Name: win32_x64
    TargetCPU: x64
    BuildUWP: --no-uwp
    CanRunTest: true
  - Name: win32_x86
    TargetCPU: x86
    BuildUWP: --no-uwp
    CanRunTest: true
  - Name: win32_arm64
    TargetCPU: arm64
    BuildUWP: --no-uwp
    CanRunTest: true
    # On an x64 agent build.js can only cross-compile the shared libraries and
    # skips the tests. Flag per cell, not per TargetCPU, to keep uwp_arm64 on x64.
    UseArm64Pool: true
    # ARM64 "Emulation Compatible" is to run ARM64 Hermes DLL in a x64 app
    # on Windows ARM64 in emulation mode.
    # See: https://learn.microsoft.com/en-us/windows/arm/arm64ec
  - Name: win32_arm64ec
    TargetCPU: arm64ec
    BuildUWP: --no-uwp
    # ARM64EC runs natively on Windows on ARM, so the test binaries are ARM64EC
    # too and exercise the ARM64EC DLLs that ship.
    CanRunTest: true
    UseArm64Pool: true

resources:
  repositories:
    # The repo for the Office compliant build pipeline templates.
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  # Extend the Office compliant build pipeline template.
  ${{ if eq(parameters.MustPublish, true) }}:
    template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  ${{ else }}:
    template: v1/Office.Unofficial.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    settings:
      ${{ if eq(parameters.MustPublish, false) }}:
        skipBuildTagsForGitHubPullRequests: true
      # fabric-internal-pool-large hosts several images, so the one with VS 2026
      # must be named explicitly. See .ado/image/README.md.
    pool:
      name: fabric-internal-pool-large
      demands: ImageOverride -equals windows-2025-1espt
    sdl:
      binskim:
        analyzeTarget: |
          $(Build.StagingDirectory)\out\pkg-staging\**\*.dll
          $(Build.StagingDirectory)\out\pkg-staging\**\*.exe
      componentgovernance:
        ignoreDirectories: $(Build.SourcesDirectory)\website
      eslint:
        # This repo does not ship any JavaScript code. All JS/TS files are test
        # cases, benchmarks, or internal tools. Exclusions are in .eslintignore
        # at the repo root. enableExclusions must be true so the Guardian task
        # does not pass --no-ignore to ESLint (which would bypass .eslintignore).
        enableExclusions: true
      bandit:
        # This repo does not ship any Python code. All .py files are build
        # scripts, test utilities, benchmarks, or external tools (LLVM lit).
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.ado\guardian\sdl\.gdnsuppress
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true

    stages:
    - stage: main
      jobs:

        #=============================================================================
        # POC (temporary): confirm whether a PR build (fork vs non-fork) can use the
        # managed identity to warm an uncached package into the ms/react-native-public
        # feed. PR builds only; remove after the experiment.
        #=============================================================================
      - ${{ if eq(parameters.MustPublish, false) }}:
        - job: POC_Warm_Feed_Cache
          displayName: 'POC: warm ADO feed with MI'
          variables:
          - name: pocFeed
            value: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
          - name: pocPkg
            value: tiny-invariant
          - name: pocVer
            value: '1.0.0'
          steps:
            # Always runs (no service connection): records whether ADO treats this
            # build as a fork and confirms the package is cold before any warm.
          - pwsh: |
              $feed = '$(pocFeed)'
              $pkg  = '$(pocPkg)'
              $ver  = '$(pocVer)'
              $tgz  = "$feed$pkg/-/$pkg-$ver.tgz"
              Write-Host "BUILD_REASON=$env:BUILD_REASON"
              Write-Host "IS_FORK=$env:SYSTEM_PULLREQUEST_ISFORK"
              Write-Host "PR_SOURCE_REPO=$env:SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI"
              Write-Host "BASE_REPO=$env:BUILD_REPOSITORY_URI"
              $pre = (curl.exe -sSL -o "$env:TEMP\poc_pre.bin" -w '%{http_code}' "$tgz")
              Write-Host "RESULT_PRE_WARM_ANON=$pre"
            displayName: 'POC context + pre-warm probe (no MI)'

            # Needs the managed identity. On a fork PR the service connection is
            # withheld, so this step is expected to fail there; continueOnError keeps
            # the overall run green so the log can be read.
          - task: AzureCLI@2
            displayName: Acquire MI token and warm one feed package
            continueOnError: true
            inputs:
              azureSubscription: Office-Hermes-Windows-Bot
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $feed = '$(pocFeed)'
                $pkg  = '$(pocPkg)'
                $ver  = '$(pocVer)'
                $tgz  = "$feed$pkg/-/$pkg-$ver.tgz"

                # 1) Can this build mint the cross-org feed token via MI?
                $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                if ([string]::IsNullOrWhiteSpace($token)) { throw 'NO_MI_TOKEN - managed identity / service connection not available to this build (expected on a fork PR).' }
                Write-Host "##vso[task.setsecret]$token"
                Write-Host 'RESULT_TOKEN_ACQUIRED=yes'

                # 2) Warm the exact version with the MI token (same header npm sends).
                $meta = (curl.exe -sS  -H "Authorization: Bearer $token" -o "$env:TEMP\poc_meta.json" -w '%{http_code}' "$feed$pkg")
                $warm = (curl.exe -sSL -H "Authorization: Bearer $token" -o "$env:TEMP\poc_warm.tgz"  -w '%{http_code}' "$tgz")
                Write-Host "RESULT_AUTH_META=$meta RESULT_AUTH_TARBALL=$warm"

                # 3) Anonymous probe AFTER warm (expect 200 = now cached in the feed).
                $post = (curl.exe -sSL -o "$env:TEMP\poc_post.bin" -w '%{http_code}' "$tgz")
                Write-Host "RESULT_POST_WARM_ANON=$post"

                Write-Host "POC SUMMARY: token=yes authTarball=$warm postWarmAnon=$post"
                if ($post -ne '200') { throw "WARM_NOT_VISIBLE - post-warm anonymous probe returned $post (expected 200)." }
                Write-Host 'POC PASSED - this build has MI and warmed the feed (anonymous can now fetch the version).'

        #=============================================================================
        # Set version numbers.
        #=============================================================================
      - job: Set_Versions
        displayName: Set semantic and file versions

        variables:
          # Component Governance is ran as part of the Build Job.
        - name: skipComponentGovernanceDetection
          value: true
          # Convert MustPublish parameter to a variable to access it in the script.
        - name: mustPublish
          value: ${{ parameters.MustPublish }}

        steps:
          # Compute the semanticVersion and fileVersion, and then update the build title.
        - script: node .ado\scripts\setVersionNumber.js
          name: setVersions # For output variable prefix
          displayName: Compute version numbers

        #=============================================================================
        # Build hermes binaries.
        #=============================================================================
      - ${{ each MatrixEntry in parameters.BuildMatrix }}:
        - job: Build_Hermes_${{ MatrixEntry.Name }}
          displayName: Build Hermes ${{ MatrixEntry.Name }}

          dependsOn:
          - Set_Versions

          timeoutInMinutes: 300

          # Single-image pool, so no ImageOverride demand.
          ${{ if eq(MatrixEntry.UseArm64Pool, true) }}:
            pool:
              name: windows-2025-1espt-arm64

          variables:
          - name: semanticVersion
            value: $[ dependencies.Set_Versions.outputs['setVersions.semanticVersion'] ]
          - name: fileVersion
            value: $[ dependencies.Set_Versions.outputs['setVersions.fileVersion'] ]
            # To be used in the build script
          - name: fakeBuildArg
            ${{ if eq(parameters.FakeBuild, true) }}:
              value: --fake-build
            ${{ else }}:
              value: --no-fake-build
          - name: sanitizeHandlesArg
            ${{ if eq(parameters.SanitizeHandles, true) }}:
              value: --sanitize-handles
            ${{ else }}:
              value: --no-sanitize-handles
            # Route npm through the ms/react-native-public feed (npmjs.org
            # upstream) so the Node-API test toolchain restores from the feed.
          - name: NPM_CONFIG_REGISTRY
            value: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
          - name: NPM_CONFIG_CACHE
            value: $(Agent.TempDirectory)/.npmCache
            # Fail instead of letting npx silently fetch a networked tool.
          - name: NPM_CONFIG_YES
            value: "false"

          templateContext:
            outputs:
              # The base template takes care of publishing the artifacts.
            - output: pipelineArtifact
              artifactName: ${{ MatrixEntry.Name }}
              targetPath: $(Build.StagingDirectory)\out\pkg-staging

          steps:
            # Must run before anything else on the agent - see the template.
          - ${{ if eq(MatrixEntry.UseArm64Pool, true) }}:
            - template: /.ado/ensure-node10-shim.yml@self

            # Invoke the build specific for the target platform.
          - script: >
              node .ado\scripts\build.js
              --output-path $(Build.StagingDirectory)\out
              --platform ${{ MatrixEntry.TargetCPU }}
              --configuration release
              ${{ MatrixEntry.BuildUWP }}
              --semantic-version "$(semanticVersion)"
              --file-version "$(fileVersion)"
              $(fakeBuildArg)
              $(sanitizeHandlesArg)
            displayName: Build binaries

            # Show all built files to help debug issues.
          - pwsh: |
              Get-ChildItem -LiteralPath "$(Build.StagingDirectory)\out" -Recurse |
                Select-Object -ExpandProperty FullName
            displayName: Show all staged files

            # Run unit tests after the build is finished.
          - ${{ if eq(MatrixEntry.CanRunTest, true) }}:
            - script: >
                node .ado\scripts\build.js
                --no-build
                --test
                --output-path $(Build.StagingDirectory)\out
                --platform ${{ MatrixEntry.TargetCPU }}
                --configuration release
                ${{ MatrixEntry.BuildUWP }}
                --semantic-version "$(semanticVersion)"
                --file-version "$(fileVersion)"
                $(fakeBuildArg)
                $(sanitizeHandlesArg)
              displayName: Run unit tests

            # Run Lit tests which are mostly JS tests.
            - script: >
                node .ado\scripts\build.js
                --no-build
                --jstest
                --output-path $(Build.StagingDirectory)\out
                --platform ${{ MatrixEntry.TargetCPU }}
                --configuration release
                ${{ MatrixEntry.BuildUWP }}
                --semantic-version "$(semanticVersion)"
                --file-version "$(fileVersion)"
                $(fakeBuildArg)
                $(sanitizeHandlesArg)
              displayName: Run JS regression tests

            # Run Test262 Intl tests.
            - script: >
                node .ado\scripts\build.js
                --no-build
                --test262-intl
                --output-path $(Build.StagingDirectory)\out
                --platform ${{ MatrixEntry.TargetCPU }}
                --configuration release
                ${{ MatrixEntry.BuildUWP }}
                --semantic-version "$(semanticVersion)"
                --file-version "$(fileVersion)"
                $(fakeBuildArg)
                $(sanitizeHandlesArg)
              displayName: Run Test262 Intl tests

            # Sign and publish symbols only for the CI builds and real builds.
          - ${{ if and(eq(parameters.MustPublish, true), eq(parameters.FakeBuild, false)) }}:
            - task: EsrpCodeSigning@6
              displayName: CodeSign Binaries
              inputs:
                connectedServiceName: 'ESRP-JSHost3'
                appRegistrationClientId: '0a35e01f-eadf-420a-a2bf-def002ba898d'
                appRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
                authAKVName: 'OGX-JSHost-KV'
                authCertName: 'OGX-JSHost-Auth4'
                authSignCertName: 'OGX-JSHost-Sign3'
                folderPath: $(Build.StagingDirectory)\out\pkg-staging
                # Recursively finds files matching these patterns:
                pattern: |
                  **\hermes.dll
                  **\hermes.exe
                  **\hermesc.exe
                useMinimatch: true
                signConfigType: inlineSignParams
                inlineOperation: |
                  [
                    {
                      "KeyCode" : "CP-230012",
                      "OperationCode" : "SigntoolSign",
                      "Parameters" : {
                        "OpusName" : "Microsoft",
                        "OpusInfo" : "http://www.microsoft.com",
                        "FileDigest" : "/fd \"SHA256\"",
                        "PageHash" : "/NPH",
                        "TimeStamp" : "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                      },
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                    },
                    {
                      "KeyCode" : "CP-230012",
                      "OperationCode" : "SigntoolVerify",
                      "Parameters" : {},
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                    }
                  ]

            # Make symbols available through http://symweb.
            - task: PublishSymbols@2
              displayName: Publish symbols
              inputs:
                SearchPattern: $(Build.StagingDirectory)\out\pkg-staging\**\*.pdb
                SymbolServerType: TeamServices
                UseNetCoreClientTool: true

      #=============================================================================
      # Create NuGet packages
      #=============================================================================
      - job: Create_Hermes_NuGet
        displayName: Create Nuget packages

        dependsOn:
        - Set_Versions
        - ${{ each MatrixEntry in parameters.BuildMatrix }}:
          - Build_Hermes_${{ MatrixEntry.Name }}

        variables:
        - name: semanticVersion
          value: $[ dependencies.Set_Versions.outputs['setVersions.semanticVersion'] ]
        - name: fileVersion
          value: $[ dependencies.Set_Versions.outputs['setVersions.fileVersion'] ]

        templateContext:
          outputs:
            # The base template takes care of publishing the artifacts.
          - output: pipelineArtifact
            targetPath: $(Build.StagingDirectory)\out\pkg
            artifactName: published-packages

        steps:
          # The substitution tags in the nuspec require that we use at least NuGet 4.6.
        - task: NuGetToolInstaller@0
          displayName: Install NuGet tools
          inputs:
            versionSpec: ">=4.6.0"

          # Download hermes binaries built in previous jobs.
        - ${{ each MatrixEntry in parameters.BuildMatrix }}:
          - task: DownloadPipelineArtifact@2
            displayName: Download ${{ MatrixEntry.Name }} hermes artifacts
            inputs:
              artifact: ${{ MatrixEntry.Name }}
              path: $(Build.StagingDirectory)\out\pkg-staging

          # Create NuGet packages.
        - script: >
            node .ado\scripts\build.js
            --output-path $(Build.StagingDirectory)\out
            --no-build
            --pack
            --semantic-version "$(semanticVersion)"
            --file-version "$(fileVersion)"
          displayName: Create NuGet packages

          # Sign the NuGet packages only for CI builds.
        - ${{ if parameters.MustPublish }}:
          - task: EsrpCodeSigning@6
            displayName: CodeSign NuGets
            inputs:
              connectedServiceName: 'ESRP-JSHost3'
              appRegistrationClientId: '0a35e01f-eadf-420a-a2bf-def002ba898d'
              appRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
              authAKVName: 'OGX-JSHost-KV'
              authCertName: 'OGX-JSHost-Auth4'
              authSignCertName: 'OGX-JSHost-Sign3'
              folderPath: $(Build.StagingDirectory)\out\pkg
              pattern: |
                Microsoft.JavaScript.Hermes.*.nupkg
              useMinimatch: true
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  {
                    "KeyCode" : "CP-401405",
                    "OperationCode" : "NuGetSign",
                    "Parameters" : {},
                    "ToolName" : "sign",
                    "ToolVersion" : "1.0"
                  },
                  {
                    "KeyCode" : "CP-401405",
                    "OperationCode" : "NuGetVerify",
                    "Parameters" : {},
                    "ToolName" : "sign",
                    "ToolVersion" : "1.0"
                  }
                ]
