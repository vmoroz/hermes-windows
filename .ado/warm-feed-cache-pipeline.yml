#
# Scheduled pipeline that keeps the ms/react-native-public npm feed warm.
#
# The PR/CI builds restore the Node-API test toolchain from that feed anonymously.
# A version the feed has never been asked for is not cached yet, so an anonymous
# restore fails until the version is pulled in. This pipeline runs from main with a
# managed identity and issues the authenticated requests that pull main's closure
# (and every open dependency-bump branch's delta) into the feed, so anonymous
# restores stay green.
#
# It runs out-of-band on purpose: it must never be triggered from a PR branch's
# YAML, because that would expose the managed identity to PR-controlled code. Keep
# it on trigger: none plus the schedule below, queued against main.
#

name: Warm feed cache $(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

schedules:
- cron: "0 */6 * * *"
  displayName: Warm the feed cache every 6 hours
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

variables:
- name: feedRegistry
  value: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
  # Definition id of the PR validation pipeline to re-queue after warming a
  # dependency-bump branch. 0 warms without re-queuing.
- name: prValidationPipelineId
  value: 0

extends:
  # Non-production template: this pipeline caches packages, it does not publish.
  template: v1/Office.Unofficial.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: fabric-internal-pool-large
      demands: ImageOverride -equals windows-2025-1espt
    sdl:
      eslint:
        enableExclusions: true
      bandit:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.ado\guardian\sdl\.gdnsuppress

    stages:
    - stage: warm
      displayName: Warm feed cache
      jobs:
      - job: warm_feed
        displayName: Warm npm feed cache
        timeoutInMinutes: 60
        steps:
        - checkout: self
          fetchDepth: 1

        - task: AzureCLI@2
          displayName: Warm feed with managed identity
          inputs:
            azureSubscription: Office-Hermes-Windows-Bot
            visibleAzLogin: false
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              $ErrorActionPreference = 'Stop'

              # Cross-organization feed token from the managed identity. Mask it
              # immediately and never write it to a variable or the log.
              $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
              if ([string]::IsNullOrWhiteSpace($token)) { throw 'Managed identity token was not available.' }
              Write-Host "##vso[task.setsecret]$token"

              $scripts = Join-Path $env:BUILD_SOURCESDIRECTORY '.ado\scripts'
              $lock = Join-Path $env:BUILD_SOURCESDIRECTORY 'unittests\NodeApi\test\package-lock.json'

              # Keep main's committed closure warm.
              & "$scripts\Warm-FeedCache.ps1" -Feed '$(feedRegistry)' -Token $token -LockFile $lock

              # Warm the delta of every open dependency-bump branch, then re-queue
              # its PR validation so warm-then-validate happens in order.
              git fetch origin --prune --depth=1 '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dependabot/*:refs/remotes/origin/dependabot/*' --quiet
              $branches = git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/dependabot/*'
              foreach ($ref in $branches) {
                if ([string]::IsNullOrWhiteSpace($ref)) { continue }
                $branch = $ref -replace '^origin/', ''
                try {
                  Write-Host "Warming delta for $branch"
                  & "$scripts\Warm-FeedCache.ps1" -Feed '$(feedRegistry)' -Token $token -Branch $ref -BaseRef 'origin/main'
                  & "$scripts\Queue-PrValidation.ps1" -SourceBranch "refs/heads/$branch" -DefinitionId $(prValidationPipelineId)
                } catch {
                  Write-Host "##vso[task.logissue type=warning]Warming $branch failed: $($_.Exception.Message)"
                }
              }
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
